<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background: #101418; color: #f6f1e7; font-family: "Inter", sans-serif;
    display: grid; place-content: center; padding: 6vmin; box-sizing: border-box;
  }
  h1 { font: 700 clamp(48px, 9vmin, 140px)/1.02 "Inter", sans-serif; letter-spacing: -0.03em; margin: 0 0 4vmin; }
  p  { font: 500 clamp(20px, 3.2vmin, 44px)/1.3 "IBM Plex Mono", monospace; margin: 0; color: #9fb3c8; }
  @media (orientation: portrait) { body { place-content: end start; } }
</style>
</head>
<body>
  <h1>Design review,<br>on demand.</h1>
  <p>Spike render · stills toolchain</p>
</body>
</html>
